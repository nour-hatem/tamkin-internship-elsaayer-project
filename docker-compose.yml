services:
  postgres:
    image: postgres:16-alpine
    container_name: toyota_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: toyota_user
      POSTGRES_PASSWORD: toyota_password
      POSTGRES_DB: toyota_kiosk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: toyota_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
    name: toyota_postgres_data
  redis_data:
    name: toyota_redis_data
